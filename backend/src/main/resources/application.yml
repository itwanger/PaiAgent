server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: PaiAgent
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java,src/main/resources
    livereload:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      password: ${REDIS_PASSWORD:}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:paiagent}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  ai:
    openai:
      # 占位配置，实际使用时通过节点配置动态指定
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: https://api.openai.com
  servlet:
    multipart:
      max-file-size: ${RAG_MAX_FILE_SIZE:10MB}
      max-request-size: ${RAG_MAX_FILE_SIZE:10MB}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.paiagent.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  info:
    title: PaiAgent API
    description: AI Agent 流图执行面板 API 文档
    version: 1.0.0

# MinIO 配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # 访问凭据必须通过环境变量注入，禁止在仓库中提供可用默认值。
  accessKey: ${MINIO_ACCESS_KEY:}
  secretKey: ${MINIO_SECRET_KEY:}
  bucketName: paiagent
  publicUrl: ${MINIO_PUBLIC_URL:http://localhost:9000}

# PaiAgent 配置
paiagent:
  rag:
    migration-enabled: ${RAG_MIGRATION_ENABLED:true}
    datasource:
      url: ${RAG_POSTGRES_URL:${PAIAGENT_VECTOR_STORE_URL:jdbc:postgresql://localhost:5432/paiagent_vector}}
      username: ${RAG_POSTGRES_USERNAME:${PAIAGENT_VECTOR_STORE_USERNAME:paiagent}}
      # 数据库密码必须通过环境变量注入。
      password: ${RAG_POSTGRES_PASSWORD:${PAIAGENT_VECTOR_STORE_PASSWORD:}}
    embedding:
      config-id: ${RAG_EMBEDDING_CONFIG_ID:}
      model: ${RAG_EMBEDDING_MODEL:doubao-embedding-vision}
      dimension: ${RAG_EMBEDDING_DIMENSION:1024}
      batch-size: ${RAG_EMBEDDING_BATCH_SIZE:10}
    limits:
      max-file-bytes: ${RAG_MAX_FILE_BYTES:10485760}
      max-text-chars: ${RAG_MAX_TEXT_CHARS:2000000}
      max-chunks: ${RAG_MAX_CHUNKS:5000}
      max-context-chars: ${RAG_MAX_CONTEXT_CHARS:32000}
    stream:
      enabled: ${RAG_STREAM_ENABLED:true}
      key: ${RAG_STREAM_KEY:paiagent:rag:index}
      group: ${RAG_STREAM_GROUP:paiagent-rag-indexers}
      consumer: ${RAG_STREAM_CONSUMER:${HOSTNAME:paiagent-local}}
      poll-delay-ms: ${RAG_STREAM_POLL_DELAY_MS:1000}
  vector-store:
    # 已废弃兼容项：RAG 模块固定使用 PostgreSQL。
    type: ${PAIAGENT_VECTOR_STORE_TYPE:pgvector}
    url: ${PAIAGENT_VECTOR_STORE_URL:jdbc:postgresql://localhost:5432/paiagent_vector}
    username: ${PAIAGENT_VECTOR_STORE_USERNAME:paiagent}
    password: ${PAIAGENT_VECTOR_STORE_PASSWORD:}
    # 必须与 embedding 模型返回的维度一致；schema-pgvector.sql 也要同步修改。
    dimension: ${PAIAGENT_VECTOR_STORE_DIMENSION:1024}
  auth:
    # 本地开发未配置 JWT_SECRET 时会自动生成临时强密钥；生产环境请务必显式配置
    jwt-secret: ${JWT_SECRET:}
    access-token-expiration-minutes: 120
    refresh-token-expiration-hours: 168
  # 默认管理员账户（生产环境必须修改或禁用）
  # 通过环境变量 APP_AUTH_DEFAULT_USERNAME 和 APP_AUTH_DEFAULT_PASSWORD 配置
  # 留空则禁用默认账户，必须通过注册功能创建账户
  default-username: ${APP_AUTH_DEFAULT_USERNAME:admin}
  default-password: ${APP_AUTH_DEFAULT_PASSWORD:admin123}
  skills:
    path: skills
